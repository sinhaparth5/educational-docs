# Sveltia CMS: open /admin/ and use "Sign In with Token" (fine-grained PAT, this repo only,
# Contents read/write). Locally, `bunx astro dev` + /admin/index.html in Chromium offers
# "Work with Local Repository". Fields mirror src/content.config.ts; keep them in sync.
backend:
  name: github
  repo: sinhaparth5/educational-docs
  branch: master

site_url: https://edu.parthsinha.com

# Global media library (must be an absolute URL path). Post images are set per collection
# below and live next to the posts as ./images/<file>.
media_folder: public/images
public_folder: /images

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: src/content/posts
    extension: mdx
    format: frontmatter
    create: true
    slug: '{{slug}}'
    identifier_field: title
    media_folder: images
    public_folder: ./images
    sortable_fields: [date, title]
    # Preview (public/admin/preview.js) renders KaTeX; MDX components and citations need `astro dev`.
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text }
      - { name: date, label: Date, widget: datetime, type: date }
      - { name: updated, label: Updated, widget: datetime, type: date, required: false }
      - { name: featured, label: Featured, widget: boolean, default: false, required: false }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: draft, label: Draft, widget: boolean, default: true, required: false }
      - { name: cover, label: Cover (1200×630), widget: image, required: false }
      - { name: coverAlt, label: Cover alt text, widget: text, required: false }
      - name: series
        label: Series
        widget: object
        required: false
        fields:
          - { name: name, label: Name, widget: string }
          - { name: part, label: Part, widget: number, value_type: int, min: 1 }
      # Raw mode only: the rich-text editor would rewrite $math$, imports and [@cite] keys.
      - { name: body, label: Body, widget: richtext, modes: [raw] }
